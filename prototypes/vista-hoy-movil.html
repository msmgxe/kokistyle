<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
<title>Luxaris — Vista "Hoy" móvil (prototipo)</title>
<style>
  :root {
    --desk: #E9E2D4;
    --desk-text: #5C6A6E;
    --ink: #16323D;
    --soft: #5C6A6E;
    --faint: #97A1A0;
    --cream: #F7F3EB;
    --card: #FFFFFF;
    --line: #E6DDCB;
    --navy: #395886;
    --ok: #4F8A63;
    --bad: #B0492F;
    --amber: #B98A2F;
    --note-bg: #FBF5E6;
    --note-line: #EAD9AC;
  }
  @media (prefers-color-scheme: dark) {
    :root { --desk: #1C2529; --desk-text: #9FB0B5; }
  }
  :root[data-theme="dark"] { --desk: #1C2529; --desk-text: #9FB0B5; }
  :root[data-theme="light"] { --desk: #E9E2D4; --desk-text: #5C6A6E; }

  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  body {
    margin: 0; background: var(--desk);
    font-family: "Avenir Next", "Segoe UI", system-ui, -apple-system, sans-serif;
    color: var(--ink);
    display: flex; flex-direction: column; align-items: center;
    min-height: 100vh; padding: 26px 12px 40px;
  }
  .intro { text-align: center; color: var(--desk-text); max-width: 420px; margin-bottom: 18px; }
  .intro h1 { font-size: 15px; margin: 0 0 4px; letter-spacing: .04em; color: var(--desk-text); font-weight: 700; }
  .intro p { font-size: 12px; margin: 0; line-height: 1.5; }

  /* ── Marco de teléfono ── */
  .phone {
    width: 100%; max-width: 400px;
    background: #10181C; border-radius: 44px; padding: 12px;
    box-shadow: 0 30px 70px rgba(10, 25, 32, .45);
  }
  .screen {
    background: var(--cream); border-radius: 34px; overflow: hidden;
    height: 800px; max-height: 86vh;
    display: flex; flex-direction: column; position: relative;
  }
  @media (max-width: 480px) {
    body { padding: 0; }
    .intro { display: none; }
    .phone { max-width: none; border-radius: 0; padding: 0; box-shadow: none; }
    .screen { border-radius: 0; height: 100vh; max-height: none; }
  }

  /* ── Cabecera ── */
  .top {
    background: var(--ink); color: #fff; padding: 18px 18px 14px;
    border-radius: 0 0 24px 24px; flex-shrink: 0;
  }
  .top .brand { font-size: 9px; font-weight: 800; letter-spacing: .3em; color: #A8C0BC; }
  .date-row { display: flex; align-items: center; gap: 10px; margin-top: 8px; }
  .date-big { flex: 1; }
  .date-big .wd { font-size: 11px; font-weight: 700; letter-spacing: .12em; color: #A8C0BC; }
  .date-big .d {
    font-family: "Bookman Old Style", "Book Antiqua", Palatino, Georgia, serif;
    font-size: 26px; line-height: 1.15;
  }
  .nav-day {
    display: grid; place-items: center; width: 38px; height: 38px;
    border: 1.5px solid rgba(255,255,255,.25); border-radius: 13px;
    background: none; color: #fff; font-size: 17px; cursor: pointer;
  }
  .nav-day:active { background: rgba(255,255,255,.12); }
  .btn-today {
    border: 0; border-radius: 13px; padding: 0 13px; height: 38px;
    background: rgba(255,255,255,.14); color: #fff;
    font: inherit; font-size: 12px; font-weight: 700; cursor: pointer;
  }
  .btn-today.on { background: #fff; color: var(--ink); }

  /* Progreso */
  .progress { display: flex; align-items: center; gap: 14px; margin-top: 14px; }
  .ring { position: relative; width: 62px; height: 62px; flex-shrink: 0; }
  .ring svg { transform: rotate(-90deg); }
  .ring .pct {
    position: absolute; inset: 0; display: grid; place-items: center;
    font-size: 14px; font-weight: 800;
  }
  .progress .meta { font-size: 12px; color: #C4D2CF; line-height: 1.6; }
  .progress .meta b { color: #fff; font-size: 14px; }

  /* Filtros */
  .filters { display: flex; gap: 6px; padding: 12px 16px 4px; flex-shrink: 0; }
  .chip {
    border: 1.5px solid var(--line); background: #fff; color: var(--soft);
    font: inherit; font-size: 11.5px; font-weight: 700;
    border-radius: 999px; padding: 6px 13px; cursor: pointer;
  }
  .chip.on { background: var(--navy); border-color: var(--navy); color: #fff; }

  /* ── Lista scrollable ── */
  .list { flex: 1; overflow-y: auto; padding: 10px 14px 96px; }

  /* Notas del día */
  .note {
    display: flex; align-items: center; gap: 10px;
    background: var(--note-bg); border: 1px solid var(--note-line);
    border-radius: 14px; padding: 11px 13px; margin-bottom: 8px;
  }
  .note .pin { flex-shrink: 0; color: var(--amber); font-size: 13px; }
  .note .txt { flex: 1; min-width: 0; font-size: 13px; font-weight: 600; color: #7A6230; }
  .note.done .txt { color: var(--faint); text-decoration: line-through; font-weight: 400; }
  .add-note {
    display: flex; align-items: center; gap: 8px; width: 100%;
    background: none; border: 1.5px dashed var(--note-line); color: var(--amber);
    border-radius: 14px; padding: 10px 13px; margin-bottom: 14px;
    font: inherit; font-size: 12px; font-weight: 700; cursor: pointer;
  }

  /* Proyecto */
  .proj-head {
    display: flex; align-items: center; gap: 8px; flex-wrap: wrap;
    margin: 16px 2px 8px;
  }
  .proj-head .name {
    font-family: "Bookman Old Style", "Book Antiqua", Palatino, Georgia, serif;
    font-size: 15.5px; font-weight: 600;
  }
  .status {
    font-size: 8px; font-weight: 800; letter-spacing: .08em; text-transform: uppercase;
    padding: 3px 8px; border-radius: 999px;
  }
  .st-en_obra  { background: #DCEBDD; color: #35664A; }
  .st-aprobado { background: #EDF3FB; color: #395886; }
  .proj-head .where { font-size: 11px; color: var(--faint); }
  .proj-head .tally { margin-left: auto; font-size: 11px; font-weight: 700; color: var(--ok); font-variant-numeric: tabular-nums; }

  /* Tarjeta de tarea — táctil, grande */
  .task {
    display: flex; align-items: center; gap: 12px; width: 100%; text-align: left;
    background: var(--card); border: 1px solid var(--line); border-radius: 16px;
    padding: 13px 14px; margin-bottom: 8px;
    font: inherit; cursor: pointer;
    transition: transform .12s ease, opacity .2s ease;
  }
  .task:active { transform: scale(.98); }
  .cbox {
    flex-shrink: 0; width: 26px; height: 26px; border-radius: 9px;
    border: 2px solid #C6BCA6; display: grid; place-items: center;
    transition: background .15s ease, border-color .15s ease;
  }
  .cbox svg { opacity: 0; transform: scale(.5); transition: all .15s ease; }
  .task.done .cbox { background: var(--ok); border-color: var(--ok); }
  .task.done .cbox svg { opacity: 1; transform: scale(1); }
  .task .body { flex: 1; min-width: 0; }
  .sec {
    display: inline-block; font-size: 8.5px; font-weight: 800;
    padding: 2.5px 8px; border-radius: 999px; margin-bottom: 4px;
  }
  .task .name { font-size: 14px; font-weight: 600; line-height: 1.3; }
  .task.done .name { color: var(--faint); text-decoration: line-through; font-weight: 400; }
  .task .meta { display: flex; align-items: center; gap: 6px; margin-top: 5px; font-size: 11px; color: var(--soft); }
  .avatar {
    display: inline-grid; place-items: center; width: 17px; height: 17px;
    border-radius: 50%; background: var(--ink); color: #fff;
    font-size: 7px; font-weight: 800;
  }
  .task .hrs { flex-shrink: 0; font-size: 12px; font-weight: 700; color: var(--soft); font-variant-numeric: tabular-nums; }

  .empty { text-align: center; color: var(--faint); font-size: 13px; font-style: italic; padding: 40px 20px; }

  /* ── Tab bar inferior ── */
  .tabbar {
    position: absolute; bottom: 0; left: 0; right: 0;
    display: flex; background: #fff; border-top: 1px solid var(--line);
    padding: 8px 6px calc(10px + env(safe-area-inset-bottom));
  }
  .tab {
    flex: 1; display: flex; flex-direction: column; align-items: center; gap: 3px;
    background: none; border: 0; font: inherit; font-size: 9.5px; font-weight: 700;
    color: var(--faint); cursor: pointer;
  }
  .tab.on { color: var(--navy); }
  .tab .ic { font-size: 17px; line-height: 1; }

  .toast {
    position: absolute; bottom: 84px; left: 50%; transform: translateX(-50%) translateY(8px);
    background: var(--ink); color: #fff; font-size: 12px; font-weight: 600;
    padding: 9px 16px; border-radius: 12px; opacity: 0; pointer-events: none;
    transition: all .25s ease; white-space: nowrap; z-index: 5;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  @media (prefers-reduced-motion: reduce) {
    .task, .cbox, .cbox svg, .toast { transition: none; }
  }
</style>

<div class="intro">
  <h1>PROTOTIPO — VISTA "HOY" MÓVIL</h1>
  <p>Checklist del día al abrir la PWA en el teléfono: tareas por proyecto + notas del día, con checkbox grande. Toca las tarjetas para marcar. Usa ‹ › para cambiar de día.</p>
</div>

<div class="phone"><div class="screen">
  <div class="top">
    <div class="brand">LUXARIS DESIGN</div>
    <div class="date-row">
      <div class="date-big">
        <div class="wd" id="wd">LUNES</div>
        <div class="d serif" id="dlabel">13 de julio</div>
      </div>
      <button class="nav-day" onclick="moveDay(-1)" aria-label="Día anterior">‹</button>
      <button class="btn-today on" id="btnToday" onclick="goToday()">Hoy</button>
      <button class="nav-day" onclick="moveDay(1)" aria-label="Día siguiente">›</button>
    </div>
    <div class="progress">
      <div class="ring">
        <svg width="62" height="62" viewBox="0 0 62 62">
          <circle cx="31" cy="31" r="26" fill="none" stroke="rgba(255,255,255,.15)" stroke-width="6"/>
          <circle id="ringFg" cx="31" cy="31" r="26" fill="none" stroke="#4F8A63" stroke-width="6"
            stroke-linecap="round" stroke-dasharray="163.4" stroke-dashoffset="163.4"/>
        </svg>
        <span class="pct" id="pct">0%</span>
      </div>
      <div class="meta" id="meta"></div>
    </div>
  </div>

  <div class="filters" id="filters"></div>
  <div class="list" id="list"></div>

  <div class="tabbar">
    <button class="tab on"><span class="ic">✓</span>Hoy</button>
    <button class="tab" onclick="toastMsg('Abriría el Reporte diario')"><span class="ic">🗓</span>Reporte</button>
    <button class="tab" onclick="toastMsg('Abriría el Gantt G')"><span class="ic">📊</span>Gantt</button>
    <button class="tab" onclick="toastMsg('Abriría tu Agenda')"><span class="ic">🔔</span>Agenda</button>
  </div>
  <div class="toast" id="toast"></div>
</div></div>

<script>
  const SEC = {
    demo:  { name: "DEMOLITION", bg: "#FDF0ED", fg: "#B0492F" },
    plumb: { name: "PLUMBING",   bg: "#DCE8E9", fg: "#4E7A82" },
    elec:  { name: "ELECTRICAL", bg: "#EDE3CF", fg: "#7A6230" },
    tile:  { name: "TILE",       bg: "#EDF3FB", fg: "#395886" },
    admin: { name: "ADMIN",      bg: "#EFEFEF", fg: "#5C5C5C" },
  };
  const PROJECTS = {
    p1: { name: "Master Bathroom",  status: "en_obra",  stLabel: "In Progress", where: "Sofiya · Aventura" },
    p2: { name: "House Remodeling", status: "en_obra",  stLabel: "In Progress", where: "Simon · Boca Raton" },
    p3: { name: "Las Olas Terrace", status: "aprobado", stLabel: "Approved",    where: "M. Fontaine · Ft. Lauderdale" },
  };
  // Datos por día (offset relativo a hoy) — simula lo que traería Supabase
  const DAYS = {
    "-1": {
      label: ["DOMINGO", "12 de julio"],
      notes: [{ id: "n0", t: "Comprar silicona y cinta para demolición", done: true }],
      tasks: [
        { id: "y1", p: "p1", s: "demo", t: "Protección de pisos y áreas comunes", who: "Jorge M.", h: 3, done: true },
        { id: "y2", p: "p1", s: "demo", t: "Retiro de espejo y accesorios", who: "Jorge M.", h: 2, done: true },
      ],
    },
    "0": {
      label: ["LUNES", "13 de julio"],
      notes: [
        { id: "n1", t: "Llamar a Sofiya para confirmar selección de tile", done: false },
        { id: "n2", t: "Pasar por Home Depot: thinset y espaciadores", done: false },
      ],
      tasks: [
        { id: "t1", p: "p1", s: "demo",  t: "Demolición de shower walls",            who: "Jorge M.", h: 4, done: true  },
        { id: "t2", p: "p1", s: "demo",  t: "Retiro de piso existente (120 sq.ft)",  who: "Jorge M.", h: 3, done: false },
        { id: "t3", p: "p1", s: "plumb", t: "Reubicar válvula de ducha",             who: "Luis P.",  h: 3, done: false },
        { id: "t4", p: "p2", s: "admin", t: "Someter permiso a la ciudad",           who: "Oficina",  h: 2, done: false },
        { id: "t5", p: "p3", s: "admin", t: "Enviar planos y seguro a la HOA",       who: "Oficina",  h: 1, done: false },
      ],
    },
    "1": {
      label: ["MARTES", "14 de julio"],
      notes: [{ id: "n3", t: "Recordar a Luis traer la válvula nueva", done: false }],
      tasks: [
        { id: "m1", p: "p1", s: "plumb", t: "Instalar drenaje lineal en ducha",  who: "Luis P.",  h: 5, done: false },
        { id: "m2", p: "p1", s: "elec",  t: "Salidas LED bajo gabinete",         who: "E. Ramos", h: 3, done: false },
        { id: "m3", p: "p2", s: "tile",  t: "Nivelación de piso en cocina",      who: "V. Costa", h: 6, done: false },
      ],
    },
  };

  let offset = 0;
  let filter = "all";
  const $ = id => document.getElementById(id);
  const esc = s => s.replace(/[&<>"]/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;" }[c]));

  function toastMsg(m) {
    const el = $("toast");
    el.textContent = m;
    el.classList.add("show");
    clearTimeout(toastMsg._t);
    toastMsg._t = setTimeout(() => el.classList.remove("show"), 1800);
  }

  function moveDay(d) {
    const next = offset + d;
    if (!DAYS[String(next)]) { toastMsg("Sin datos de ejemplo para ese día"); return; }
    offset = next;
    render();
  }
  function goToday() { offset = 0; render(); }

  function toggleTask(id) {
    const day = DAYS[String(offset)];
    const t = day.tasks.find(x => x.id === id);
    if (t) { t.done = !t.done; render(); if (t.done) toastMsg("✓ Guardado — sincronizado con la web"); }
  }
  function toggleNote(id) {
    const n = DAYS[String(offset)].notes.find(x => x.id === id);
    if (n) { n.done = !n.done; render(); }
  }

  function render() {
    const day = DAYS[String(offset)];
    $("wd").textContent = day.label[0] + (offset === 0 ? " · HOY" : "");
    $("dlabel").textContent = day.label[1];
    $("btnToday").classList.toggle("on", offset === 0);

    const total = day.tasks.length;
    const done = day.tasks.filter(t => t.done).length;
    const hrs = day.tasks.reduce((s, t) => s + t.h, 0);
    const hrsDone = day.tasks.filter(t => t.done).reduce((s, t) => s + t.h, 0);
    const pct = total ? Math.round(done / total * 100) : 0;
    $("pct").textContent = pct + "%";
    $("ringFg").style.strokeDashoffset = String(163.4 * (1 - pct / 100));
    $("meta").innerHTML = "<b>" + done + " de " + total + "</b> actividades completadas<br>" + hrsDone + "h de " + hrs + "h del día";

    const counts = { all: total, pend: total - done, done };
    $("filters").innerHTML = [
      ["all", "Todas"], ["pend", "Pendientes"], ["done", "Hechas"],
    ].map(([k, l]) =>
      '<button class="chip' + (filter === k ? " on" : "") + '" onclick="filter=\'' + k + '\';render()">' +
      l + " · " + counts[k] + "</button>"
    ).join("");

    let html = "";
    for (const n of day.notes) {
      html += '<div class="note' + (n.done ? " done" : "") + '" onclick="toggleNote(\'' + n.id + '\')" role="button">' +
        '<span class="pin">📌</span><span class="txt">' + esc(n.t) + "</span>" +
        '<span class="cbox" style="width:22px;height:22px;border-radius:7px;' +
        (n.done ? "background:#4F8A63;border-color:#4F8A63" : "") + '">' +
        (n.done ? checkSvg() : "") + "</span></div>";
    }
    html += '<button class="add-note" onclick="toastMsg(\'Abriría el input de nota (crea agenda_event)\')">＋ Nota del día…</button>';

    const shown = day.tasks.filter(t => filter === "all" || (filter === "done" ? t.done : !t.done));
    const projIds = [...new Set(shown.map(t => t.p))];
    if (shown.length === 0) {
      html += '<p class="empty">Nada ' + (filter === "done" ? "completado" : "pendiente") + " por aquí ✨</p>";
    }
    for (const pid of projIds) {
      const p = PROJECTS[pid];
      const pt = shown.filter(t => t.p === pid);
      const pAll = day.tasks.filter(t => t.p === pid);
      html += '<div class="proj-head"><span class="name">' + esc(p.name) + "</span>" +
        '<span class="status st-' + p.status + '">' + p.stLabel + "</span>" +
        '<span class="where">' + esc(p.where) + "</span>" +
        '<span class="tally">' + pAll.filter(t => t.done).length + "/" + pAll.length + " ✓</span></div>";
      for (const t of pt) {
        const sec = SEC[t.s];
        html += '<button class="task' + (t.done ? " done" : "") + '" onclick="toggleTask(\'' + t.id + '\')">' +
          '<span class="cbox">' + checkSvg() + "</span>" +
          '<span class="body">' +
            '<span class="sec" style="background:' + sec.bg + ";color:" + sec.fg + '">' + sec.name + "</span>" +
            '<div class="name">' + esc(t.t) + "</div>" +
            '<div class="meta"><span class="avatar">' + esc(t.who.split(/\s+/).map(w => w[0]).join("").slice(0, 2).toUpperCase()) + "</span>" + esc(t.who) + "</div>" +
          "</span>" +
          '<span class="hrs">' + t.h + "h</span></button>";
      }
    }
    $("list").innerHTML = html;
  }

  function checkSvg() {
    return '<svg width="14" height="14" viewBox="0 0 14 14"><path d="M2 7.5 5.5 11 12 3.5" fill="none" stroke="#fff" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/></svg>';
  }

  render();
</script>

</body>
</html>
