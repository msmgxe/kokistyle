<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>KokiStyle Florida</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600;700;800&family=Hanken+Grotesk:wght@400;500;600;700&family=Spline+Sans+Mono:wght@500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --paper:#F7F3EA; --card:#FFFFFF; --card-2:#ECE3D1;
    --ink:#16323D; --ink-soft:#5C6A6E; --ink-faint:#97A1A0;
    --line:#E6DDCB; --line-2:#D7CBB3;
    --amber:#16323D; --amber-deep:#0E2630; --amber-soft:#DCE6E6;
    --blue:#4E7A82; --blue-soft:#DCE8E9;
    --green:#4F8A63; --green-soft:#DCEBDD;
    --red:#B0492F; --red-soft:#F0DBD2;
    --font-display:'Manrope'; --font-body:'Hanken Grotesk'; --font-mono:'Spline Sans Mono';
    --shadow:0 1px 2px rgba(20,40,50,.06), 0 8px 24px -12px rgba(20,40,50,.20);
    --shadow-lg:0 2px 6px rgba(20,40,50,.08), 0 22px 50px -20px rgba(20,40,50,.32);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%}
  body{font-family:var(--font-body),sans-serif;color:var(--ink);background:var(--paper);-webkit-font-smoothing:antialiased;line-height:1.45}
  .wrap{max-width:1180px;margin:0 auto;padding:0 24px}
  @media(max-width:560px){.wrap{padding:0 16px}}
  button{font-family:inherit}

  /* ===== Landing (KokiStyle) ===== */
  .lnav{position:sticky;top:0;z-index:30;background:var(--paper);border-bottom:1px solid var(--line)}
  .lnav .wrap{display:flex;align-items:center;gap:18px;padding-top:14px;padding-bottom:14px}
  .ks-brand{display:flex;align-items:center;gap:11px}
  .ks-logo{width:40px;height:40px;border-radius:10px;background:var(--ink);color:#fff;display:grid;place-items:center;font-family:var(--font-display);font-weight:800;font-size:15px}
  .ks-word b{font-family:var(--font-display);font-weight:800;font-size:18px;display:block;line-height:1;color:var(--ink)}
  .ks-word span{font-size:9.5px;color:var(--ink-soft);letter-spacing:.22em;text-transform:uppercase;display:block;margin-top:2px}
  .lnav nav{display:flex;gap:22px;margin-left:14px;flex:1}
  .lnav nav a{font-size:14px;font-weight:600;color:var(--ink);cursor:pointer;white-space:nowrap}
  .lnav nav a:hover{color:var(--blue)}
  .lnav .right{display:flex;align-items:center;gap:14px}
  .lang{display:flex;border:1px solid var(--line-2);border-radius:8px;overflow:hidden;font-size:12px;font-weight:700}
  .lang button{background:transparent;border:0;padding:7px 11px;cursor:pointer;color:var(--ink-soft)}
  .lang button.on{background:var(--ink);color:#fff}
  .phone{font-weight:700;font-size:14px;color:var(--ink);white-space:nowrap}
  .btn-nav{background:var(--ink);color:#fff;border:0;border-radius:11px;padding:11px 16px;font-weight:700;font-size:13.5px;cursor:pointer}
  .btn-admin{display:inline-flex;align-items:center;gap:7px;background:#fff;color:var(--ink);border:1.5px solid var(--ink);border-radius:11px;padding:10px 15px;font-weight:700;font-size:13.5px;cursor:pointer}
  .btn-admin:active,.btn-nav:active{transform:scale(.97)}
  @media(max-width:900px){.lnav nav,.phone,.lnav .btn-nav{display:none}.lnav nav{flex:1}}
  @media(max-width:900px){.lnav .right{flex:1;justify-content:flex-end}}

  .hero .wrap{display:grid;grid-template-columns:1.05fr .95fr;gap:48px;align-items:center;padding-top:56px;padding-bottom:64px}
  @media(max-width:860px){.hero .wrap{grid-template-columns:1fr;gap:30px;padding-top:34px;padding-bottom:40px}}
  .eyebrow{font-size:13px;font-weight:700;letter-spacing:.22em;text-transform:uppercase;color:var(--blue);margin-bottom:18px}
  .hero h1{font-family:var(--font-display);font-weight:800;font-size:clamp(40px,6vw,76px);line-height:1.02;letter-spacing:-.02em;color:var(--ink);margin-bottom:22px}
  .hero p.lead{font-size:17px;color:var(--ink-soft);line-height:1.6;max-width:480px;margin-bottom:28px}
  .hero-cta{display:flex;gap:13px;flex-wrap:wrap;margin-bottom:38px}
  .cta-primary{background:var(--ink);color:#fff;border:0;border-radius:13px;padding:16px 24px;font-weight:700;font-size:15px;cursor:pointer}
  .cta-ghost{background:#fff;color:var(--ink);border:1px solid var(--line-2);border-radius:13px;padding:16px 24px;font-weight:700;font-size:15px;cursor:pointer}
  .hero-stats{display:flex;gap:30px;flex-wrap:wrap;border-top:1px solid var(--line);padding-top:26px}
  .hero-stats .s b{font-family:var(--font-display);font-weight:800;font-size:30px;color:var(--ink);display:block;line-height:1}
  .hero-stats .s span{font-size:13px;color:var(--ink-soft);display:block;margin-top:6px;max-width:130px}
  .hero-img{position:relative;border-radius:18px;min-height:380px;background:
     radial-gradient(120% 100% at 70% 10%, #2b5563 0%, #16323D 55%, #0e2630 100%);
     overflow:hidden;box-shadow:var(--shadow-lg)}
  @media(max-width:860px){.hero-img{min-height:240px}}
  .hero-img::after{content:"";position:absolute;inset:0;background:
     linear-gradient(115deg, transparent 40%, rgba(255,255,255,.06) 41%, transparent 43%),
     repeating-linear-gradient(0deg, rgba(255,255,255,.05) 0 1px, transparent 1px 46px),
     repeating-linear-gradient(90deg, rgba(255,255,255,.05) 0 1px, transparent 1px 46px)}
  .hero-tag{position:absolute;right:18px;bottom:18px;background:var(--ink);color:#fff;border-radius:14px;padding:15px 18px;max-width:230px;box-shadow:var(--shadow-lg)}
  .hero-tag .e{font-size:10.5px;font-weight:700;letter-spacing:.16em;text-transform:uppercase;color:#9db6bb;margin-bottom:6px}
  .hero-tag .t{font-family:var(--font-display);font-weight:700;font-size:17px;line-height:1.2}

  /* ===== App (zona privada) ===== */
  .anav{position:sticky;top:0;z-index:30;background:var(--paper);border-bottom:1px solid var(--line)}
  .anav .wrap{display:flex;align-items:center;gap:16px;padding-top:12px;padding-bottom:12px}
  .anav .tabsnav{display:flex;gap:4px;flex:1;overflow-x:auto;scrollbar-width:none}
  .anav .tabsnav::-webkit-scrollbar{display:none}
  .anav .tabsnav button{background:none;border:0;font-weight:700;font-size:13.5px;color:var(--ink-soft);padding:8px 13px;border-radius:9px;cursor:pointer;white-space:nowrap}
  .anav .tabsnav button.on{background:var(--ink);color:#fff}
  .out{display:inline-flex;align-items:center;gap:6px;background:#fff;border:1px solid var(--line-2);color:var(--ink);border-radius:10px;padding:9px 13px;font-weight:700;font-size:12.5px;cursor:pointer;flex:none}

  main{padding:26px 0 120px}
  .ptitle{font-family:var(--font-display);font-weight:800;font-size:25px;letter-spacing:-.02em;margin-bottom:3px}
  .psub{font-size:13.5px;color:var(--ink-soft);margin-bottom:22px}
  h2.section{font-family:var(--font-display);font-weight:700;font-size:16px;margin:26px 0 13px;display:flex;align-items:center;gap:8px}

  .kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(155px,1fr));gap:13px}
  .kpi{border:1px solid var(--line);border-radius:15px;padding:15px 16px;background:var(--card)}
  .kpi .k{font-size:11px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;color:var(--ink-soft)}
  .kpi .v{font-family:var(--font-mono);font-weight:600;font-size:23px;letter-spacing:-.02em;margin-top:8px}
  .kpi.up .v{color:var(--green)} .kpi.down .v{color:var(--red)} .kpi.due .v{color:var(--ink)}
  .kpi .s{font-size:11px;color:var(--ink-soft);margin-top:3px}

  .cards{display:grid;grid-template-columns:repeat(auto-fill,minmax(310px,1fr));gap:15px}
  .pcard{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:17px;cursor:pointer;box-shadow:var(--shadow);transition:transform .15s,box-shadow .15s;text-align:left;width:100%;color:inherit;font:inherit}
  .pcard:active{transform:scale(.99)}
  @media(hover:hover){.pcard:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}}
  .pcard .top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px;margin-bottom:11px}
  .pcard .amt{font-family:var(--font-mono);font-weight:600;font-size:17px}
  .pcard h3{font-family:var(--font-display);font-weight:700;font-size:18px;line-height:1.15}
  .pcard .meta{font-size:12px;color:var(--ink-soft);margin-top:3px;display:flex;align-items:center;gap:5px}
  .pcard .meta svg{flex:none;opacity:.6}
  .bars{margin-top:14px;display:flex;flex-direction:column;gap:9px}
  .barrow{display:flex;flex-direction:column;gap:5px}
  .barlbl{display:flex;justify-content:space-between;font-size:11px;font-weight:600;color:var(--ink-soft)}
  .barlbl .v{font-family:var(--font-mono);color:var(--ink)}
  .track{height:7px;border-radius:99px;background:var(--line);overflow:hidden}
  .track i{display:block;height:100%;border-radius:99px}
  .track i.adv{background:linear-gradient(90deg,var(--blue),#5e8c94)}
  .track i.pay{background:linear-gradient(90deg,var(--green),#63a079)}
  .track i.paid{background:var(--green)}

  .chip{display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;padding:4px 9px;border-radius:999px}
  .chip.presupuesto{background:var(--amber-soft);color:var(--amber-deep)}
  .chip.aprobado{background:var(--blue-soft);color:var(--blue)}
  .chip.en_obra{background:#EDE3CF;color:#7A6230}
  .chip.terminado{background:var(--green-soft);color:var(--green)}
  .chip.dot::before{content:"";width:6px;height:6px;border-radius:50%;background:currentColor}

  /* detail */
  .dhead{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;flex-wrap:wrap;margin-bottom:14px}
  .back{display:inline-flex;align-items:center;gap:6px;background:none;border:0;color:var(--ink-soft);font-weight:600;font-size:13px;cursor:pointer;padding:6px 0;margin-bottom:4px}
  .dhead h1{font-family:var(--font-display);font-weight:800;font-size:24px;letter-spacing:-.02em;line-height:1.1}
  .dhead .sub{font-size:12.5px;color:var(--ink-soft);margin-top:5px;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
  .tabs{display:flex;gap:3px;border-bottom:1px solid var(--line);overflow-x:auto;scrollbar-width:none;margin-bottom:20px}
  .tabs::-webkit-scrollbar{display:none}
  .tabs button{flex:none;background:none;border:0;font-weight:600;font-size:13.5px;color:var(--ink-soft);padding:11px 12px;cursor:pointer;position:relative;white-space:nowrap}
  .tabs button.on{color:var(--ink)}
  .tabs button.on::after{content:"";position:absolute;left:9px;right:9px;bottom:-1px;height:2.5px;background:var(--ink);border-radius:2px}
  .panel{max-width:760px}

  .board{display:flex;gap:13px;overflow-x:auto;padding-bottom:4px}
  .col{flex:0 0 260px;background:var(--card-2);border:1px solid var(--line);border-radius:15px;padding:13px}
  .col h5{font-size:11px;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-soft);margin-bottom:11px;display:flex;align-items:center;gap:7px}
  .col h5 .dotc{width:8px;height:8px;border-radius:50%}
  .col h5 .n{margin-left:auto;background:var(--paper);border:1px solid var(--line);border-radius:99px;padding:1px 8px;font-size:11px;font-family:var(--font-mono)}
  .kcard{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:11px 12px;margin-bottom:9px;cursor:pointer;transition:box-shadow .12s}
  .kcard:last-child{margin-bottom:0}
  @media(hover:hover){.kcard:hover{box-shadow:var(--shadow)}}
  .kcard .knm{font-size:13px;font-weight:600;line-height:1.25}
  .kcard .kmeta{display:flex;align-items:center;justify-content:space-between;margin-top:10px;gap:8px}
  .kcard .kh{font-size:11px;color:var(--ink-soft);font-family:var(--font-mono)}
  .assignee{display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:600;color:var(--ink-soft);min-width:0}
  .assignee .nm{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:120px}
  .avatar{width:21px;height:21px;border-radius:50%;display:grid;place-items:center;font-size:8.5px;font-weight:700;color:#fff;flex:none}
  .avatar.team{background:var(--blue)} .avatar.ext{background:var(--ink)}
  .hintline{font-size:11.5px;color:var(--ink-soft);margin:0 0 14px;display:flex;align-items:center;gap:6px}

  .msum{display:grid;grid-template-columns:1fr 1fr;gap:11px;margin-bottom:15px;max-width:420px}
  .msum div{border:1px solid var(--line);border-radius:13px;padding:12px 14px;background:var(--card)}
  .msum .k{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft)}
  .msum .v{font-family:var(--font-mono);font-weight:600;font-size:18px;margin-top:5px}
  .msum .por .v{color:var(--ink)} .msum .com .v{color:var(--green)}
  .mlist,.plist,.clist{display:flex;flex-direction:column;gap:9px}
  .mitem{display:flex;align-items:center;gap:12px;padding:12px 14px;background:var(--card);border:1px solid var(--line);border-radius:13px;cursor:pointer}
  .mitem .check{width:23px;height:23px;border-radius:7px;border:2px solid var(--line-2);flex:none;display:grid;place-items:center}
  .mitem.bought .check{background:var(--green);border-color:var(--green)}
  .mitem .check svg{opacity:0} .mitem.bought .check svg{opacity:1}
  .mitem .minfo{flex:1;min-width:0}
  .mitem .mnm{font-size:13.5px;font-weight:600}
  .mitem.bought .mnm{text-decoration:line-through;color:var(--ink-soft)}
  .mitem .msup{font-size:11px;color:var(--ink-soft);margin-top:2px}
  .mitem .mcost{font-family:var(--font-mono);font-weight:600;font-size:13.5px;flex:none}

  .ccard{display:flex;gap:13px;padding:14px;background:var(--card);border:1px solid var(--line);border-radius:16px;box-shadow:var(--shadow)}
  .ccard .cav{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;font-family:var(--font-display);font-weight:800;font-size:15px;color:#fff;flex:none;background:var(--ink)}
  .ccard .cbody{flex:1;min-width:0}
  .ccard .cnm{font-family:var(--font-display);font-weight:700;font-size:14.5px;cursor:pointer}
  .ccard .cspec{font-size:12px;color:var(--ink-soft);margin-top:1px}
  .ccard .cfor{margin-top:9px;display:flex;flex-wrap:wrap;gap:6px}
  .ptag{font-size:10.5px;font-weight:700;padding:4px 9px;border-radius:8px;cursor:pointer;border:1px solid var(--line-2);background:var(--card);color:var(--ink-soft)}
  .ptag.on{background:var(--blue-soft);color:var(--blue);border-color:var(--blue-soft)}
  .ccard .cright{display:flex;flex-direction:column;align-items:flex-end;gap:9px;flex:none}
  .ccard .crate{font-size:11px;font-weight:600;color:var(--ink-soft);font-family:var(--font-mono);white-space:nowrap}
  .crow{display:flex;gap:8px}
  .iconbtn{display:grid;place-items:center;width:32px;height:32px;border-radius:9px;border:1px solid var(--line-2);background:#fff;color:var(--ink-soft);cursor:pointer}
  .callbtn{display:inline-flex;align-items:center;gap:5px;background:var(--green-soft);color:var(--green);border:0;border-radius:9px;padding:7px 11px;font-weight:700;font-size:11.5px;cursor:pointer}

  .blines{background:var(--card);border:1px solid var(--line);border-radius:16px;overflow:hidden}
  .bline{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 15px;border-bottom:1px solid var(--line);cursor:pointer}
  .bline:last-child{border-bottom:0}
  .bline .l{display:flex;align-items:center;gap:10px;min-width:0}
  .bline .tag{font-size:9.5px;font-weight:700;letter-spacing:.05em;text-transform:uppercase;padding:3px 6px;border-radius:5px;flex:none}
  .bline .tag.mano{background:var(--blue-soft);color:var(--blue)}
  .bline .tag.material{background:var(--amber-soft);color:var(--amber-deep)}
  .bline .nm{font-size:13px;font-weight:500;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .bline .v{font-family:var(--font-mono);font-weight:600;font-size:13px;flex:none}
  .btotal{display:flex;justify-content:space-between;align-items:center;padding:15px;margin-top:13px;background:var(--ink);color:#fff;border-radius:14px}
  .btotal .k{font-weight:600;font-size:13px} .btotal .v{font-family:var(--font-mono);font-weight:600;font-size:19px}

  .seg{display:inline-flex;background:var(--card-2);border:1px solid var(--line);border-radius:11px;padding:3px;gap:3px;margin-bottom:16px}
  .seg button{border:0;background:none;padding:9px 18px;border-radius:8px;font-weight:700;font-size:13px;color:var(--ink-soft);cursor:pointer}
  .seg button.on{background:#fff;color:var(--ink);box-shadow:var(--shadow)}
  .paysum{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:6px;max-width:620px}
  .paytile{border:1px solid var(--line);border-radius:14px;padding:13px 15px;background:var(--card)}
  .paytile .k{font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;color:var(--ink-soft)}
  .paytile .v{font-family:var(--font-mono);font-weight:600;font-size:19px;margin-top:6px}
  .paytile.in .v{color:var(--green)} .paytile.out .v{color:var(--red)} .paytile.caja .v{color:var(--ink)}
  .pitem{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 14px;background:var(--card);border:1px solid var(--line);border-radius:13px;cursor:pointer}
  .pitem .l .mth{font-weight:600;font-size:13px;display:flex;align-items:center;gap:7px}
  .pitem .l .dt{font-size:11px;color:var(--ink-soft);margin-top:2px}
  .pitem .tg{font-size:9px;font-weight:700;text-transform:uppercase;letter-spacing:.05em;padding:2px 6px;border-radius:5px;background:var(--card-2);color:var(--ink-soft)}
  .pitem .v{font-family:var(--font-mono);font-weight:600;font-size:15px}
  .pitem .v.in{color:var(--green)} .pitem .v.out{color:var(--red)}
  .celebrate{background:linear-gradient(150deg,#E7F1E6,#D7EBDA);border:1px solid var(--green-soft);color:var(--green);padding:12px 15px;border-radius:13px;font-weight:600;font-size:13px;display:flex;align-items:center;gap:9px;margin:13px 0}
  .addbtn{margin-top:13px;padding:13px 16px;border-radius:13px;border:1.5px dashed var(--line-2);background:var(--card-2);color:var(--ink);font-weight:700;font-size:13.5px;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:8px}
  .addbtn.full{width:100%}
  .addbtn:active{transform:scale(.99)}

  /* gantt (proyecto + portafolio) */
  .plan-intro{font-size:12.5px;color:var(--ink-soft);margin-bottom:14px}
  .planlist{display:flex;flex-direction:column;gap:8px}
  .planrow{display:grid;grid-template-columns:22px minmax(120px,180px) 1fr auto;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:9px 12px}
  .planrow.dragging{opacity:.85;box-shadow:var(--shadow-lg);border-color:var(--ink)}
  .phandle{width:22px;height:30px;display:grid;place-items:center;color:var(--ink-faint);cursor:grab;touch-action:none}
  .pmeta{min-width:0}
  .pmeta .pnm{font-size:13px;font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
  .pmeta .pdt{font-size:10.5px;color:var(--ink-soft);font-family:var(--font-mono);margin-top:2px}
  .gtrack{position:relative;height:20px;background:var(--card-2);border-radius:6px;overflow:hidden}
  .gbar{position:absolute;top:2px;height:16px;border-radius:5px;display:flex;align-items:center;padding:0 7px;font-size:9.5px;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden}
  .gbar.done{background:linear-gradient(90deg,var(--green),#69a67e)}
  .gbar.prog{background:linear-gradient(90deg,var(--blue),#5e8c94)}
  .gbar.pend,.gbar.presupuesto{background:var(--line-2);color:var(--ink-soft)}
  .gbar.en_obra{background:linear-gradient(90deg,var(--blue),#5e8c94)}
  .gbar.terminado{background:linear-gradient(90deg,var(--green),#69a67e)}
  .gbar.aprobado{background:var(--ink)}
  .delrow{width:30px;height:30px;border-radius:8px;border:1px solid var(--line-2);background:#fff;color:var(--red);display:grid;place-items:center;cursor:pointer}
  .glegend{display:flex;gap:16px;margin-top:14px;font-size:11px;color:var(--ink-soft);flex-wrap:wrap}
  .glegend span{display:inline-flex;align-items:center;gap:6px}

/* ===== Plan global (portafolio) ===== */
function planGlobalView(){
  const spans=data.map(p=>{ const s=new Date(p.startDate+'T00:00:00'); const e=addDays(p.startDate,totalWeeks(p)*7); return {p,s,e}; });
  let min=spans[0].s, max=spans[0].e; spans.forEach(x=>{ if(x.s<min)min=x.s; if(x.e>max)max=x.e; });
  min=new Date(min.getFullYear(),min.getMonth(),1); max=new Date(max.getFullYear(),max.getMonth()+1,1);
  const totalMs=max-min;
  let mlabels=''; let cur=new Date(min);
  while(cur<max){ const left=(cur-min)/totalMs*100; mlabels+='<span style="position:absolute;left:'+left+'%;font-size:10px;color:var(--ink-soft);font-weight:600">'+MONTHS[cur.getMonth()]+'</span>'; cur=new Date(cur.getFullYear(),cur.getMonth()+1,1); }
  const rows=data.map((p,i)=>{ const sp=spans.find(x=>x.p===p); const left=(sp.s-min)/totalMs*100, width=(sp.e-sp.s)/totalMs*100;
    return '<div class="planrow'+(drag&&drag.kind==='proj'&&drag.idx===i?' dragging':'')+'">'+
      '<div class="phandle" onpointerdown="dragStartProj(event,'+i+')">'+ICON.grip+'</div>'+
      '<div class="pmeta"><div class="pnm">'+p.title.split(' — ')[0]+'</div><div class="pdt">'+dShort(sp.s)+'–'+dShort(sp.e)+' · '+p.client+'</div></div>'+
      '<div class="gtrack"><div class="gbar '+p.status+'" style="left:'+left+'%;width:'+Math.max(width,6)+'%">'+STAT[p.status]+'</div></div>'+
      '<button class="delrow" onclick="delProject(\''+p.id+'\')">'+ICON.trash+'</button></div>';
  }).join('');
  return '<div class="ptitle">Plan del portafolio</div><div class="psub">Cronograma de todos los proyectos. Arrastra ⠿ para priorizar y usa la papelera para eliminar.</div>'+
    '<div style="position:relative;height:16px;margin:0 0 6px 192px">'+mlabels+'</div>'+
    '<div class="planlist" id="portlist">'+rows+'</div>'+
    '<div class="glegend"><span><i style="background:var(--ink)"></i>Aprobado</span><span><i style="background:var(--blue)"></i>En obra</span><span><i style="background:var(--green)"></i>Terminado</span><span><i style="background:var(--line-2)"></i>Presupuesto</span></div>';

/* ===== Plan de proyecto (gantt + dnd) ===== */
function schedule(p){ let cum=0; const rows=p.tasks.map(t=>{ const s=cum+1, start=addDays(p.startDate,cum*7), end=addDays(p.startDate,(cum+t.d)*7-1); cum+=t.d; return {t,s,start,end}; }); return {rows,total:Math.max(6,cum)}; }
function planTab(p){
  const {rows,total}=schedule(p); const colW=100/total;
  const list=rows.map((r,i)=>{ const left=(r.s-1)*colW, width=r.t.d*colW;
    return '<div class="planrow'+(drag&&drag.kind==='task'&&drag.idx===i?' dragging':'')+'"><div class="phandle" onpointerdown="dragStartTask(event,'+i+')">'+ICON.grip+'</div>'+
      '<div class="pmeta"><div class="pnm">'+r.t.nm+'</div><div class="pdt">'+dShort(r.start)+'–'+dShort(r.end)+' · '+r.t.h+'h</div></div>'+
      '<div class="gtrack"><div class="gbar '+r.t.st+'" style="left:'+left+'%;width:'+width+'%">S'+r.s+'</div></div>'+
      '<button class="delrow" onclick="delTask(\''+p.id+'\','+i+')">'+ICON.trash+'</button></div>';
  }).join('');
  return '<div class="panel"><p class="plan-intro">Arrastra ⠿ para reordenar; las fechas se recalculan según las horas/semanas. Usa la papelera para eliminar.</p><div class="planlist" id="planlist">'+list+'</div>'+
    '<div class="glegend"><span><i style="background:var(--green)"></i>Terminada</span><span><i style="background:var(--blue)"></i>En curso</span><span><i style="background:var(--line-2)"></i>Pendiente</span></div></div>';
}
function delTask(pid,i){ const p=proj(pid); confirmAction('Eliminar actividad','¿Eliminar "'+esc(p.tasks[i].nm)+'"? No se puede deshacer.','Eliminar',function(){ p.tasks.splice(i,1); refreshTab(); hint('Actividad eliminada.'); }); }

/* ===== Drag & drop unificado ===== */
let drag=null;
function dragStartTask(e,idx){ e.preventDefault(); drag={kind:'task',idx,listId:'planlist',pid:view.pid}; refreshTab(); }
function dragStartProj(e,idx){ e.preventDefault(); drag={kind:'proj',idx,listId:'portlist'}; render(); }
function dragMove(e){
  if(!drag) return; const list=$(drag.listId); if(!list) return;
  const rows=[...list.children]; let target=rows.length-1;
  for(let k=0;k<rows.length;k++){ const r=rows[k].getBoundingClientRect(); if(e.clientY < r.top+r.height/2){ target=k; break; } }
  if(target!==drag.idx){
    if(drag.kind==='task'){ const t=proj(drag.pid).tasks; const [m]=t.splice(drag.idx,1); t.splice(target,0,m); drag.idx=target; refreshTab(); }
    else { const [m]=data.splice(drag.idx,1); data.splice(target,0,m); drag.idx=target; render(); }
  }
}
function dragEnd(){ if(!drag) return; const k=drag.kind; drag=null; if(k==='task'){ refreshTab(); } else { render(); } hint(k==='task'?'Plan reordenado — fechas recalculadas.':'Prioridad de proyectos actualizada.'); }
document.addEventListener('pointermove',dragMove);
document.addEventListener('pointerup',dragEnd);
document.addEventListener('pointercancel',dragEnd);

function editorDelete(){ const cb=editorDel; confirmAction('Eliminar','Esta acción no se puede deshacer. ¿Eliminar?','Eliminar',function(){ if(cb) cb(); }); }

/* ===== Entidades de proyecto ===== */
function whoOptions(p){ return ['Equipo propio'].concat(projContacts(p.id).map(c=>c.nm)); }
function tapActivity(pid,i){ const p=proj(pid),t=p.tasks[i],opts=whoOptions(p); if(opts.indexOf(t.who)<0)opts.push(t.who);
  openEditor({title:'Editar actividad',sub:'También por voz.',fields:[{key:'nm',label:'Actividad',type:'text',value:t.nm},{key:'h',label:'Horas estimadas',type:'number',value:t.h},{key:'d',label:'Duración (semanas)',type:'number',value:t.d},{key:'who',label:'Responsable',type:'select',options:opts,value:t.who},{key:'st',label:'Estado',type:'select',options:['pend','prog','done'],value:t.st}],
    onSave:function(v){ t.nm=v.nm;t.h=v.h;t.d=Math.max(1,Math.round(v.d)||1);t.who=v.who;t.st=v.st;t.done=(v.st==='done'); refreshTab(); hint('Actividad actualizada.'); },
    onDelete:function(){ p.tasks.splice(i,1); refreshTab(); hint('Actividad eliminada.'); }});
}
function addActivity(pid){ const p=proj(pid),opts=whoOptions(p);
  openEditor({title:'Nueva actividad',fields:[{key:'nm',label:'Actividad',type:'text',value:''},{key:'h',label:'Horas estimadas',type:'number',value:8},{key:'d',label:'Duración (semanas)',type:'number',value:1},{key:'who',label:'Responsable',type:'select',options:opts,value:'Equipo propio'}],
    onSave:function(v){ p.tasks.push({nm:v.nm||'Actividad',h:v.h||0,d:Math.max(1,Math.round(v.d)||1),st:'pend',done:false,who:v.who}); refreshTab(); hint('Actividad agregada.'); }});
}
function tapMaterial(pid,i){ const p=proj(pid),m=p.materials[i];
  openEditor({title:'Editar material',fields:[{key:'nm',label:'Material',type:'text',value:m.nm},{key:'sup',label:'Proveedor',type:'text',value:m.sup},{key:'cost',label:'Costo (USD)',type:'number',value:m.cost},{key:'bought',label:'¿Comprado?',type:'select',options:['No','Sí'],value:m.bought?'Sí':'No'}],
    onSave:function(v){ m.nm=v.nm;m.sup=v.sup;m.cost=v.cost;m.bought=(v.bought==='Sí'); refreshTab(); hint('Material actualizado.'); },
    onDelete:function(){ p.materials.splice(i,1); refreshTab(); hint('Material eliminado.'); }});
}
function addMaterial(pid){ const p=proj(pid);
  openEditor({title:'Nuevo material',fields:[{key:'nm',label:'Material',type:'text',value:''},{key:'sup',label:'Proveedor',type:'text',value:''},{key:'cost',label:'Costo (USD)',type:'number',value:0}],
    onSave:function(v){ p.materials.push({nm:v.nm||'Material',sup:v.sup||'',cost:v.cost||0,bought:false}); refreshTab(); hint('Material agregado.'); }});
}
function tapBudget(pid,i){ const p=proj(pid),b=p.budgetItems[i];
  openEditor({title:'Editar línea',fields:[{key:'nm',label:'Descripción',type:'text',value:b.nm},{key:'type',label:'Tipo',type:'select',options:['mano','material'],value:b.type},{key:'v',label:'Monto (USD)',type:'number',value:b.v}],
    onSave:function(v){ b.nm=v.nm;b.type=v.type;b.v=v.v; refreshTab(); hint('Línea actualizada.'); },
    onDelete:function(){ p.budgetItems.splice(i,1); refreshTab(); hint('Línea eliminada.'); }});
}
function addBudget(pid){ const p=proj(pid);
  openEditor({title:'Nueva línea',fields:[{key:'nm',label:'Descripción',type:'text',value:''},{key:'type',label:'Tipo',type:'select',options:['mano','material'],value:'material'},{key:'v',label:'Monto (USD)',type:'number',value:0}],
    onSave:function(v){ p.budgetItems.push({type:v.type,nm:v.nm||'Línea',v:v.v||0}); refreshTab(); hint('Línea agregada.'); }});
}
function tapPayment(pid,i){ const p=proj(pid),x=p.payments[i];
  openEditor({title:'Editar ingreso',fields:[{key:'amount',label:'Monto (USD)',type:'number',value:x.amount},{key:'date',label:'Fecha',type:'date',value:x.date},{key:'method',label:'Método',type:'select',options:['Efectivo','Transferencia','Zelle','Cheque','Tarjeta'],value:x.method},{key:'type',label:'Concepto',type:'select',options:['abono','anticipo','final'],value:x.type}],
    onSave:function(v){ x.amount=v.amount;x.date=v.date;x.method=v.method;x.type=v.type; refreshTab(); hint('Ingreso actualizado.'); },
    onDelete:function(){ p.payments.splice(i,1); refreshTab(); hint('Ingreso eliminado.'); }});
}
function addPayment(pid){ const p=proj(pid);
  openEditor({title:'Nuevo ingreso',sub:'Pago recibido del cliente.',fields:[{key:'amount',label:'Monto (USD)',type:'number',value:0},{key:'date',label:'Fecha',type:'date',value:'2026-06-25'},{key:'method',label:'Método',type:'select',options:['Efectivo','Transferencia','Zelle','Cheque','Tarjeta'],value:'Transferencia'},{key:'type',label:'Concepto',type:'select',options:['abono','anticipo','final'],value:'abono'}],
    onSave:function(v){ if(v.amount>0){ p.payments.push({amount:v.amount,date:v.date,method:v.method,type:v.type}); refreshTab(); hint('Ingreso registrado. Saldo: '+money(balance(p))+'.'); } }});
}
function tapExpense(pid,i){ const p=proj(pid),x=p.expenses[i],payees=['Equipo propio'].concat(projContacts(pid).map(c=>c.nm)); if(payees.indexOf(x.payee)<0)payees.push(x.payee);
  openEditor({title:'Editar egreso',fields:[{key:'payee',label:'Pagado a',type:'select',options:payees,value:x.payee},{key:'concept',label:'Concepto',type:'text',value:x.concept},{key:'amount',label:'Monto (USD)',type:'number',value:x.amount},{key:'date',label:'Fecha',type:'date',value:x.date},{key:'method',label:'Método',type:'select',options:['Efectivo','Transferencia','Zelle','Cheque','Tarjeta'],value:x.method}],
    onSave:function(v){ x.payee=v.payee;x.concept=v.concept;x.amount=v.amount;x.date=v.date;x.method=v.method; refreshTab(); hint('Egreso actualizado.'); },
    onDelete:function(){ p.expenses.splice(i,1); refreshTab(); hint('Egreso eliminado.'); }});
}
function addExpense(pid){ const p=proj(pid),payees=['Equipo propio'].concat(projContacts(pid).map(c=>c.nm));
  openEditor({title:'Nuevo egreso',sub:'Pago a un especialista o proveedor.',fields:[{key:'payee',label:'Pagado a',type:'select',options:payees.length>1?payees:['Equipo propio','Proveedor'],value:payees[1]||'Proveedor'},{key:'concept',label:'Concepto',type:'text',value:''},{key:'amount',label:'Monto (USD)',type:'number',value:0},{key:'date',label:'Fecha',type:'date',value:'2026-06-25'},{key:'method',label:'Método',type:'select',options:['Efectivo','Transferencia','Zelle','Cheque','Tarjeta'],value:'Transferencia'}],
    onSave:function(v){ if(v.amount>0){ p.expenses.push({amount:v.amount,date:v.date,method:v.method,payee:v.payee,concept:v.concept||'Pago'}); refreshTab(); hint('Egreso registrado.'); } }});
}

/* ===== Voz / idioma ===== */
function setLang(l,el){ lang=l; document.querySelectorAll('.lang button').forEach(b=>b.classList.remove('on')); if(el)el.classList.add('on'); hint(l==='es'?'Idioma: Español (es-US).':'Language: English (en-US).'); }
function micDemo(){ const fab=$('fab'); fab.classList.add('live'); hint(lang==='es'?'Escuchando… dicta una actividad, ingreso o egreso y lo registro (con confirmación). <b>Voz: siguiente módulo.</b>':'Listening… <b>Voice: next module.</b>'); setTimeout(()=>fab.classList.remove('live'),2600); }
let toastT;
function hint(msg){ const t=$('toast'); t.innerHTML=msg; t.classList.add('show'); clearTimeout(toastT); toastT=setTimeout(()=>t.classList.remove('show'),3600); }

render();
</script>
</body>
</html>
