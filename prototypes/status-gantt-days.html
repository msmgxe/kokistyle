<title>Status Gantt por días — Prototipo</title>
<style>
  :root{
    --blue:#2E5D87; --blue2:#24557A; --cream:#F7F4EE; --card:#FFFFFF; --band:#F1EEE7;
    --border:#D9D2C6; --ink:#1F2D3A; --soft:#5C6A6E;
    --green1:#8FC63D; --green2:#B7DD7E; --green3:#D6EBB4;   /* filas por estado */
    --graybar:#9AA0A6; --grayfill:#7C8388; --prog:#F0B429; --done:#4F8A63; --todo:#8FA6B5;
    --red:#B0492F; --amber:#C9A227; --slate:#7C8A99;
    --weSat:#D6E4F2; --weSun:#F6DEC6;
    --shadow:0 1px 3px rgba(31,45,58,.08);
  }
  @media (prefers-color-scheme:dark){
    :root{ --cream:#0E1B22; --card:#152730; --band:#10222B; --border:#2A3F49; --ink:#E7EDF0; --soft:#9FB2B8;
      --green1:#5E8A2A; --green2:#3E5A2A; --green3:#2A3A22; --weSat:#1B3040; --weSun:#3A2A1E; --graybar:#5A636A; }
  }
  :root[data-theme="light"]{ --cream:#F7F4EE; --card:#FFFFFF; --band:#F1EEE7; --border:#D9D2C6; --ink:#1F2D3A; --soft:#5C6A6E;
    --green1:#8FC63D; --green2:#B7DD7E; --green3:#D6EBB4; --weSat:#D6E4F2; --weSun:#F6DEC6; --graybar:#9AA0A6; }
  :root[data-theme="dark"]{ --cream:#0E1B22; --card:#152730; --band:#10222B; --border:#2A3F49; --ink:#E7EDF0; --soft:#9FB2B8;
    --green1:#5E8A2A; --green2:#3E5A2A; --green3:#2A3A22; --weSat:#1B3040; --weSun:#3A2A1E; --graybar:#5A636A; }
  *{box-sizing:border-box}
  body{margin:0;background:var(--cream);color:var(--ink);font-family:Manrope,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;line-height:1.45}
  .bookman{font-family:"Bookman Old Style","Book Antiqua",Palatino,Georgia,serif}
  .mono{font-family:ui-monospace,Menlo,monospace;font-variant-numeric:tabular-nums}
  .wrap{max-width:1280px;margin:0 auto;padding:0 18px 70px}

  header.hero{background:var(--blue);color:#fff;padding:22px 18px 0}
  .hero-in{max-width:1280px;margin:0 auto}
  .hero-top{display:flex;flex-wrap:wrap;gap:14px;align-items:center;justify-content:space-between}
  .brand{display:flex;align-items:center;gap:12px}
  .brand .logo{width:42px;height:42px;border-radius:11px;background:#fff;color:var(--blue);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:14px}
  .brand h1{font-size:20px;margin:0;font-weight:400}
  .brand small{display:block;font-size:11px;opacity:.75;letter-spacing:1.4px;text-transform:uppercase}
  .badge{font-size:11px;letter-spacing:2px;text-transform:uppercase;border:1px solid rgba(255,255,255,.4);border-radius:999px;padding:5px 13px;color:#fff}
  .tabs{display:flex;gap:8px;margin-top:20px;flex-wrap:wrap}
  .tab{border:1px solid rgba(255,255,255,.25);background:transparent;color:#fff;border-radius:11px 11px 0 0;padding:11px 15px 13px;cursor:pointer;font:inherit;font-size:13px;text-align:left;min-width:220px;flex:1}
  .tab b{display:block;font-size:14px;margin-bottom:1px}
  .tab span{opacity:.72;font-size:11.5px}
  .tab.active{background:var(--cream);color:var(--ink);border-color:var(--cream)}
  .tab.active span{color:var(--soft)}

  .desc{background:var(--band);border:1px solid var(--border);border-top:none;border-radius:0 0 13px 13px;padding:12px 18px;font-size:12.5px;color:var(--soft);margin-bottom:16px}
  .desc b{color:var(--ink)}

  .toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:14px}
  .grp{display:flex;gap:4px;align-items:center;background:var(--card);border:1px solid var(--border);border-radius:11px;padding:4px}
  .grp label{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:1px;color:var(--soft);padding:0 6px}
  .pill{border:none;background:transparent;color:var(--soft);border-radius:8px;padding:5px 10px;font:inherit;font-size:11.5px;font-weight:700;cursor:pointer;white-space:nowrap}
  .pill.on{background:var(--blue);color:#fff}
  .switch{margin-left:auto;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
  .toggle{display:inline-flex;align-items:center;gap:8px;cursor:pointer;font-size:12.5px;font-weight:700}
  .toggle .track{width:38px;height:21px;border-radius:99px;background:var(--border);position:relative;transition:.15s}
  .toggle .track i{position:absolute;top:2px;left:2px;width:17px;height:17px;border-radius:50%;background:#fff;transition:.15s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
  .toggle.on .track{background:var(--green1)} .toggle.on .track i{left:19px}
  .btn{border:none;border-radius:10px;padding:9px 14px;font:inherit;font-size:12.5px;font-weight:800;cursor:pointer;display:inline-flex;align-items:center;gap:7px}
  .btn-line{background:var(--card);border:1px solid var(--border);color:var(--ink)}
  .btn-pdf{background:var(--blue);color:#fff}

  /* GANTT GRID */
  .gt{border:1px solid var(--border);border-radius:12px;overflow:hidden;background:var(--card);box-shadow:var(--shadow)}
  .gt-scroll{overflow-x:auto}
  .gt-inner{min-width:1180px}
  .gcols{display:grid;grid-template-columns:46px 118px 96px 96px 168px 44px repeat(var(--ndays),minmax(30px,1fr))}
  .gtbody{--ndays:19}
  /* header */
  .gh{background:var(--blue);color:#fff}
  .gh .hc{padding:7px 8px;font-size:10px;font-weight:800;letter-spacing:.4px;text-transform:uppercase;display:flex;align-items:center}
  .gh .hd{padding:6px 2px;text-align:center;font-size:10px;font-weight:700;border-left:1px solid rgba(255,255,255,.1)}
  .gh .hmonth{grid-column:7 / -1;text-align:center;padding:6px;font-size:12px;font-weight:800;letter-spacing:2px;background:var(--blue2);border-bottom:1px solid rgba(255,255,255,.15)}
  .gh .hleftblank{grid-column:1 / 7;background:var(--blue2)}
  .gh .hd.sat{background:rgba(120,170,220,.35)} .gh .hd.sun{background:rgba(230,160,110,.35)}
  .gh .hd b{display:block;font-size:11px}

  .prow{border-top:1px solid var(--border)}
  .phead{cursor:pointer}
  .phead:hover .lc{filter:brightness(1.03)}
  .lc{padding:8px 9px;font-size:11.5px;display:flex;align-items:center;gap:6px;border-right:1px solid var(--border);min-height:44px}
  .lc.prio{justify-content:center;font-weight:800;font-size:15px;color:#1c3b1c}
  .lc.st{flex-direction:column;align-items:flex-start;gap:3px}
  .lc.days{justify-content:center;font-weight:800;color:var(--soft)}
  /* fondo verde por estado (como la planilla) */
  .r-en_obra .lc{background:var(--green1)} .r-aprobado .lc{background:var(--green2)} .r-terminado .lc{background:var(--green3)}
  .r-presupuesto .lc{background:#EDE7DA}
  .lc .stbadge{font-size:9.5px;font-weight:800;padding:1px 7px;border-radius:999px;background:rgba(255,255,255,.65);color:#1c3b1c;text-transform:uppercase;letter-spacing:.3px}
  .lc .pbar{height:5px;border-radius:99px;background:rgba(255,255,255,.5);overflow:hidden;width:96%}
  .lc .pbar i{display:block;height:100%;background:var(--done)}
  .lc .nmwrap b{font-weight:700} .lc.proj{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;display:block;line-height:44px}

  /* celdas de dia */
  .dc{border-left:1px solid var(--border);position:relative;min-height:44px}
  .dc.sat{background:var(--weSat)} .dc.sun{background:var(--weSun)}
  .bar{position:absolute;top:50%;transform:translateY(-50%);height:16px;background:var(--graybar);left:2px;right:2px}
  .bar.l{left:3px;border-top-left-radius:5px;border-bottom-left-radius:5px}
  .bar.r{right:3px;border-top-right-radius:5px;border-bottom-right-radius:5px}
  .bar.fill{background:linear-gradient(90deg,var(--done) var(--f),var(--graybar) var(--f))}
  .abar{position:absolute;top:50%;transform:translateY(-50%);height:15px;left:2px;right:2px;border-radius:4px;font-size:8.5px;color:#fff;font-weight:700;display:flex;align-items:center;padding:0 4px;overflow:hidden;white-space:nowrap}
  .abar.todo{background:var(--todo)} .abar.prog{background:var(--prog);color:#3a2c00} .abar.done{background:var(--done)}
  .abar.hi{box-shadow:inset 0 0 0 1.5px var(--red)}

  /* detalle acordeon */
  .chevcell{display:flex;align-items:center;justify-content:flex-end;gap:6px}
  .chev{color:var(--soft);font-size:10px;transition:.2s}
  .prow.open .chev{transform:rotate(90deg)}
  .pbody{grid-column:1 / -1;display:none;background:var(--band);border-top:1px solid var(--border);padding:9px 16px 13px}
  .prow.open .pbody{display:block}
  .stgroup{margin-top:9px} .stgroup:first-child{margin-top:2px}
  .stgroup h4{display:flex;align-items:center;gap:8px;font-size:11px;letter-spacing:.5px;text-transform:uppercase;color:var(--soft);margin:0 0 5px}
  .stgroup h4 .cnt{background:var(--card);border:1px solid var(--border);border-radius:999px;padding:0 7px;font-size:10px}
  .task{display:flex;align-items:center;gap:10px;padding:6px 10px;border-radius:9px;background:var(--card);border:1px solid var(--border);margin-bottom:5px;font-size:12.5px}
  .task .tn{flex:1;min-width:0} .task .tn b{font-weight:700} .task .tn small{display:block;font-size:10.5px;color:var(--soft)}
  .sdot{font-size:9.5px;font-weight:800;border-radius:999px;padding:1px 8px;text-transform:uppercase}
  .sdot.todo{background:#E3E8EE;color:#44586B} .sdot.prog{background:#F5E6C3;color:#7A6230} .sdot.done{background:#DCEBDD;color:#4F8A63}
  .prb{font-size:9.5px;font-weight:800;border-radius:6px;padding:1px 7px;text-transform:uppercase}
  .prb.high{background:color-mix(in srgb,var(--red) 15%,var(--card));color:var(--red)} .prb.med{background:color-mix(in srgb,var(--amber) 18%,var(--card));color:#8a6d10} .prb.low{background:var(--band);color:var(--soft)}

  .legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:12px;font-size:11.5px;color:var(--soft);align-items:center}
  .legend .k{display:inline-flex;align-items:center;gap:6px} .legend .sw{width:12px;height:12px;border-radius:3px}

  .rpt-head{display:none}
  @media print{
    @page{margin:10mm;size:landscape}
    body{background:#fff;color:#000}
    header.hero,.desc,.toolbar,.legend,.no-print{display:none!important}
    .wrap{max-width:100%;padding:0}
    .rpt-head{display:block;margin-bottom:10px;border-bottom:2px solid var(--blue);padding-bottom:8px}
    .rpt-head h2{margin:0;font-size:18px;color:var(--blue)} .rpt-head p{margin:2px 0 0;font-size:11px;color:#555}
    .gt{box-shadow:none} .gt-inner{min-width:0} .prow{break-inside:avoid} .pbody{display:block!important}
  }
</style>

<header class="hero">
  <div class="hero-in">
    <div class="hero-top">
      <div class="brand"><div class="logo">LD</div><div><small>Luxaris Design · Reportes</small><h1 class="bookman">Status Gantt de Proyectos</h1></div></div>
      <span class="badge">Prototipo · 3 estilos de barra</span>
    </div>
    <div class="tabs" role="tablist">
      <button class="tab active" id="tA" onclick="setOpt('A')"><b>A · Barra de duración</b><span>Barra gris continua como la planilla</span></button>
      <button class="tab" id="tB" onclick="setOpt('B')"><b>B · Actividades por día</b><span>Cada actividad en su fecha, color por estado</span></button>
      <button class="tab" id="tC" onclick="setOpt('C')"><b>C · Barra con avance</b><span>Relleno verde = % completado</span></button>
    </div>
  </div>
</header>

<div class="wrap">
  <div class="desc" id="desc"></div>

  <div class="toolbar no-print">
    <div class="grp">
      <label>Estado</label>
      <button class="pill on" data-f="status" data-v="all" onclick="setFilter('status','all')">Todos</button>
      <button class="pill" data-f="status" data-v="aprobado" onclick="setFilter('status','aprobado')">Aprobado</button>
      <button class="pill" data-f="status" data-v="en_obra" onclick="setFilter('status','en_obra')">En obra</button>
      <button class="pill" data-f="status" data-v="terminado" onclick="setFilter('status','terminado')">Terminado</button>
    </div>
    <div class="switch">
      <button class="btn btn-line" onclick="toggleAll()">⇕ Expandir / Colapsar</button>
      <div class="toggle on" id="detailToggle" onclick="toggleDetail()"><span class="track"><i></i></span> Con detalle</div>
      <button class="btn btn-pdf" onclick="printPdf()">⬇ Generar PDF</button>
    </div>
  </div>

  <div class="rpt-head"><h2>Luxaris Design · Status de Proyectos</h2><p>Reporte generado el <span id="rptDate"></span></p></div>

  <div class="gt"><div class="gt-scroll"><div class="gt-inner"><div id="grid" class="gtbody"></div></div></div></div>

  <div class="legend no-print">
    <span class="k"><span class="sw" style="background:var(--todo)"></span> Por hacer</span>
    <span class="k"><span class="sw" style="background:var(--prog)"></span> En proceso</span>
    <span class="k"><span class="sw" style="background:var(--done)"></span> Hecho</span>
    <span class="k"><span class="sw" style="background:var(--graybar)"></span> Duración</span>
    <span class="k">Prioridad = orden (1 = más urgente)</span>
  </div>
</div>

<script>
const STATUS_ES={aprobado:"Aprobado",en_obra:"En obra",terminado:"Terminado",presupuesto:"Estimado"};
const TSTATE_ES={todo:"Por hacer",prog:"En proceso",done:"Hecho"};
const PR_ES={high:"Alta",med:"Media",low:"Baja"};
const ini=s=>s.split(/\s+/).slice(0,2).map(w=>w[0]).join("").toUpperCase();

// Julio 2026, días 13..31
const FIRST=13, LAST=31, MONTH=6, YEAR=2026;
const DAYS=[]; for(let d=FIRST;d<=LAST;d++){ const dow=new Date(YEAR,MONTH,d).getDay(); DAYS.push({d,dow,sat:dow===6,sun:dow===0}); }
const NDAYS=DAYS.length;
const DOW=["SU","MO","TU","WE","TH","FR","SA"];
const idxOf=day=>day-FIRST; // columna 0..NDAYS-1

// prioridad = ranking (1 = top). start = día del mes, dur = días
const PROJECTS=[
  {prio:1,name:"MASTER BATH",loc:"Aventura",cust:"Sofiya",status:"en_obra",start:16,dur:10,tasks:[
    {n:"Glass door",s:"todo",p:"high",day:16,h:2,sec:"Demolición"},
    {n:"Shower walls",s:"todo",p:"med",day:20,h:6,sec:"Tile"},
    {n:"Plumbing rough-in",s:"prog",p:"high",day:22,h:8,sec:"Plomería"},
    {n:"Vanity install",s:"todo",p:"low",day:25,h:4,sec:"Handyman"}]},
  {prio:2,name:"OFFICE DESK",loc:"Parkland",cust:"Craig",status:"en_obra",start:13,dur:7,tasks:[
    {n:"Frame build",s:"prog",p:"med",day:13,h:10,sec:"Carpintería"},
    {n:"Formica finish",s:"todo",p:"med",day:17,h:8,sec:"Acabados"}]},
  {prio:3,name:"POOL DECK",loc:"Boca West",cust:"Simons",status:"en_obra",start:13,dur:6,tasks:[
    {n:"Deck demo",s:"done",p:"high",day:13,h:8,sec:"Demolición"},
    {n:"Coping tile",s:"prog",p:"med",day:16,h:12,sec:"Tile"}]},
  {prio:4,name:"DESIGN · UNIT #52",loc:"Miami",cust:"CEM",status:"en_obra",start:22,dur:7,tasks:[
    {n:"Concept render",s:"prog",p:"high",day:22,h:6,sec:"Diseño"},
    {n:"Material board",s:"todo",p:"med",day:26,h:4,sec:"Diseño"}]},
  {prio:5,name:"JACUZZI · UNIT #50",loc:"Miami",cust:"CEM",status:"aprobado",start:18,dur:7,tasks:[
    {n:"Site prep",s:"todo",p:"med",day:18,h:6,sec:"Demolición"}]},
  {prio:6,name:"HOUSE REMODELING",loc:"Coral SP",cust:"Vikki",status:"en_obra",start:16,dur:15,tasks:[
    {n:"Demolition",s:"done",p:"high",day:16,h:12,sec:"Demolición"},
    {n:"Electrical",s:"prog",p:"high",day:21,h:16,sec:"Eléctrico"},
    {n:"Tile & paint",s:"todo",p:"low",day:28,h:20,sec:"Pintura"}]},
];

let opt="A", fStatus="all", detail=true;
const pct=p=>p.tasks.length?Math.round(p.tasks.filter(t=>t.s==="done").length/p.tasks.length*100):0;
const visible=()=>PROJECTS.filter(p=>fStatus==="all"||p.status===fStatus).sort((a,b)=>a.prio-b.prio);

const DESCS={
  A:"<b>Opción A — Barra de duración.</b> Una barra gris continua marca los días que ocupa cada proyecto, tal cual la planilla. Simple y ejecutiva: ves cuánto dura y cuándo cae cada proyecto.",
  B:"<b>Opción B — Actividades por día.</b> En vez de una barra sólida, cada actividad aparece en su fecha coloreada por estado (por hacer · en proceso · hecho). Ves <b>qué</b> se hace cada día, no solo la duración.",
  C:"<b>Opción C — Barra con avance.</b> La barra de duración se rellena de verde según el % completado del proyecto — un Gantt con progreso real integrado en la misma barra.",
};

function setOpt(o){ opt=o; for(const k of ["A","B","C"]) document.getElementById("t"+k).classList.toggle("active",k===o);
  document.getElementById("desc").innerHTML=DESCS[o]; render(); }
function setFilter(f,v){ fStatus=v; document.querySelectorAll(`.pill[data-f="status"]`).forEach(b=>b.classList.toggle("on",b.dataset.v===v)); render(); }
function toggleDetail(){ detail=!detail; document.getElementById("detailToggle").classList.toggle("on",detail); render(); }
function toggleAll(){ const rows=[...document.querySelectorAll(".prow")]; const anyClosed=rows.some(r=>!r.classList.contains("open")); rows.forEach(r=>r.classList.toggle("open",anyClosed)); }
function printPdf(){ if(detail) document.querySelectorAll(".prow").forEach(r=>r.classList.add("open")); window.print(); }

function header(){
  let h=`<div class="hleftblank"></div><div class="hmonth">Julio ${YEAR}</div>`;
  h+=`<div class="hc">Prio</div><div class="hc">Status</div><div class="hc">Ubicación</div><div class="hc">Cliente</div><div class="hc">Proyecto</div><div class="hc" style="justify-content:center">Días</div>`;
  h+=DAYS.map(x=>`<div class="hd ${x.sat?"sat":""} ${x.sun?"sun":""}"><b>${DOW[x.dow]}</b>${x.d}</div>`).join("");
  return h;
}

function dayCells(p){
  const startI=Math.max(0,idxOf(p.start)), endI=Math.min(NDAYS-1,idxOf(p.start)+p.dur-1);
  const fillCols=Math.round((endI-startI+1)*pct(p)/100);
  return DAYS.map((x,i)=>{
    const we=x.sat?"sat":x.sun?"sun":"";
    let inner="";
    if(opt==="A"||opt==="C"){
      if(i>=startI&&i<=endI){
        const cls=`bar ${i===startI?"l":""} ${i===endI?"r":""} ${opt==="C"?"fill":""}`;
        const fillPct=opt==="C"?( i<startI+fillCols?100 : i===startI+fillCols?50 : 0 ):0;
        inner=`<div class="${cls}" style="--f:${fillPct}%"></div>`;
      }
    } else { // B: actividad en su día
      const acts=p.tasks.filter(t=>idxOf(t.day)===i);
      inner=acts.map(t=>`<div class="abar ${t.s} ${t.p==="high"?"hi":""}" title="${t.n} · ${TSTATE_ES[t.s]}">${t.n}</div>`).join("");
    }
    return `<div class="dc ${we}">${inner}</div>`;
  }).join("");
}

function detailBody(p){
  const groups=["todo","prog","done"].map(st=>{
    const list=p.tasks.filter(t=>t.s===st); if(!list.length)return"";
    return `<div class="stgroup"><h4><span class="sdot ${st}">${TSTATE_ES[st]}</span><span class="cnt">${list.length}</span></h4>
      ${list.map(t=>`<div class="task"><span class="prb ${t.p}">${PR_ES[t.p]}</span>
        <span class="tn"><b>${t.n}</b><small>${t.sec} · ${t.h}h · ${String(t.day).padStart(2,"0")}/07</small></span>
        <span class="sdot ${t.s}">${TSTATE_ES[t.s]}</span></div>`).join("")}</div>`;
  }).join("");
  return detail ? (groups||'<p style="color:var(--soft);font-size:12px;font-style:italic;padding:4px 0">Sin actividades.</p>')
    : `<p style="color:var(--soft);font-size:12px;padding:4px 0">${p.tasks.length} actividades · ${pct(p)}% completado</p>`;
}

function render(){
  const rows=visible().map((p,idx)=>{
    const pc=pct(p);
    const head=`<div class="lc prio">${p.prio}</div>
      <div class="lc st"><span class="stbadge">${STATUS_ES[p.status]}</span><span class="pbar"><i style="width:${pc}%"></i></span><span style="font-size:9px;color:#1c3b1c">${pc}%</span></div>
      <div class="lc">${p.loc}</div>
      <div class="lc">${p.cust}</div>
      <div class="lc"><span class="proj" title="${p.name}">${p.name}</span></div>
      <div class="lc days"><span class="chevcell">${p.dur}<span class="chev">▶</span></span></div>
      ${dayCells(p)}`;
    return `<div class="prow r-${p.status} ${idx===0?"open":""}">
      <div class="phead gcols" onclick="this.closest('.prow').classList.toggle('open')">${head}</div>
      <div class="pbody">${detailBody(p)}</div>
    </div>`;
  }).join("");
  const g=document.getElementById("grid");
  g.style.setProperty("--ndays",NDAYS);
  // contenedor block; header y cada fila son grids independientes con las mismas columnas → alineados
  g.innerHTML = `<div class="gh gcols">${header()}</div>` + rows;
}

document.getElementById("rptDate").textContent=new Date().toLocaleDateString("es-US",{day:"numeric",month:"long",year:"numeric"});
